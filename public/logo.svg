<svg
  width="160"
  height="160"
  viewBox="0 0 160 160"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <!-- Purple Orbit -->
    <linearGradient id="orbitPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D946EF" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Cyan Orbit -->
    <linearGradient id="orbitCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Purple Orbit -->
  <!-- Note: This path looks like it contains invalid commands in original request (C 55 35 105 35 130 95). Attempting to fix or use as is if valid SVG path syntax. -->
  <!-- Original request had comma separators which are valid in SVG path data. -->
  <path
    d="M30 95 C55 35, 105 35, 130 95"
    stroke="url(#orbitPurple)"
    stroke-width="8"
    stroke-linecap="round"
    fill="none"
    filter="url(#glow)"
  />

  <!-- Cyan Orbit -->
  <path
    d="M35 105 C65 60, 110 60, 135 105"
    stroke="url(#orbitCyan)"
    stroke-width="6"
    stroke-linecap="round"
    fill="none"
    filter="url(#glow)"
  />

  <!-- Orbit Nodes -->
  <circle cx="78" cy="62" r="5" fill="#E879F9" />
  <circle cx="96" cy="78" r="5" fill="#67E8F9" />

  <!-- Plane -->
  <path
    d="M120 28
       L150 18
       L138 38
       L130 34
       L120 44
       Z"
    fill="#E9D5FF"
    filter="url(#glow)"
  />
</svg>
